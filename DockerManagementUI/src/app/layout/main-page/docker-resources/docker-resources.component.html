<section class="docker-resources-page py-4">
  <header class="mb-3 text-center">
    <h1 class="h2 mb-1">Docker Resources</h1>
    <p class="text-muted mb-0">Monitor and manage containers and volumes from one place.</p>
  </header>

  <div class="resources-container mx-auto">
    <mat-tab-group animationDuration="0ms" class="mat-elevation-z4 rounded bg-white">
      <mat-tab label="Containers">
        <ng-template matTabContent>
          <div class="p-2">
            <app-containers></app-containers>
          </div>
        </ng-template>
      </mat-tab>
      <mat-tab label="Volumes">
        <ng-template matTabContent>
          <div class="p-2">
            <app-volumes></app-volumes>
          </div>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </div>
</section>
