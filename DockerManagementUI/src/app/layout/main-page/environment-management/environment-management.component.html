<section class="container-fluid py-4">
  <header class="mb-3 text-center">
    <h1 class="h2 mb-1">Environment Management</h1>
    <p class="text-muted mb-0">Set up environment and generate data from one place.</p>
  </header>

  <div class="resources-container mx-auto">
    <div class="bg-white mat-elevation-z4 rounded">
      <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="px-2 border-bottom-0">
        <a
          mat-tab-link
          [routerLink]="['/environment-management/environment-start']"
          routerLinkActive
          #rla1="routerLinkActive"
          [active]="rla1.isActive"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          Environment
        </a>
        <a
          mat-tab-link
          [routerLink]="['/environment-management/data-generation']"
          routerLinkActive
          #rla2="routerLinkActive"
          [active]="rla2.isActive"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          Data Generation
        </a>
      </nav>

      <mat-tab-nav-panel #tabPanel>
        <div class="p-2">
          <router-outlet></router-outlet>
        </div>
      </mat-tab-nav-panel>
    </div>
  </div>
</section>
