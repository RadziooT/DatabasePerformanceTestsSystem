<div class="report-viewer position-relative">
  @if (hasReport()) {
    @if (loading()) {
      <div class="position-absolute w-100 h-100 d-flex flex-column align-items-center justify-content-center bg-white report-loading-overlay">
        <mat-spinner diameter="40"></mat-spinner>
        <span class="mt-3 text-muted">Loading report...</span>
      </div>
    }

    <iframe
      class="report-frame w-100 border-0 rounded"
      [class.opacity-0]="loading()"
      [src]="reportUrl()"
      [title]="title()"
      (load)="onFrameLoad()"
      (error)="onFrameError()"
    ></iframe>
  } @else {
    <div class="d-flex flex-column align-items-center justify-content-center text-muted report-placeholder">
      <mat-icon class="mb-3 icon-xl">fact_check</mat-icon>
      <p class="mb-0">Select a run from the list to view its HTML report.</p>
    </div>
  }
</div>
