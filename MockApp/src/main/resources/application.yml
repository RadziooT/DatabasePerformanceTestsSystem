spring:
  datasource:
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        order_updates: true
        jdbc:
          batch_size: 50
        cache:
          use_second_level_cache: false
          use_query_cache: false

  sql:
    init:
      mode: never

server:
  port: 8080
  tomcat:
    threads:
      max: 80

logging:
  level:
    org.hibernate.SQL: ERROR
    root: error
